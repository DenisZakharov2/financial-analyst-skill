name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff pypdf pytest-cov
          pip install --no-deps -e .

      - name: Lint
        run: ruff check .

      - name: Self-check skill
        run: python skills/financial-analyst/scripts/check_skill.py

      - name: Tests
        run: pytest -q --cov=finanalyst --cov-report=term-missing

      - name: Verify CLI entry point
        run: financial-analyst --help
