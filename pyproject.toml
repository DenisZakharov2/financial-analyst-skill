[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-analyst-skill"
version = "2.1.2"
description = "Financial analyst skill for Hermes Agent: portfolio, funnel, unit economics, forecasting"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Denis Zakharov"}]
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "plotly>=5.22,<6",
    "python-docx>=1.1,<2",
    "python-pptx>=0.6.23,<2",
    "openpyxl>=3.1,<4",
    "reportlab>=4.1,<5",
    "xlrd>=2.0,<3",
    "pypdf>=4.0,<6.0",
]

[project.scripts]
financial-analyst = "finanalyst.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "pytest-cov>=5.0"]

[tool.setuptools]
package-dir = {"" = "skills/financial-analyst/scripts"}
packages = ["finanalyst", "finanalyst.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/financial-analyst/scripts"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]